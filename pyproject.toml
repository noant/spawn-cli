[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spawn-cli"
version = "0.1.16"
description = "A minimal installable Python CLI package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "filelock>=3.12",
    "httpx>=0.27",
    'tomli>=2.0; python_version < "3.11"',
    "tomli-w>=1.0",
]

[project.scripts]
spawn = "spawn_cli.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spawn_cli.resources" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__", "**/build", "**/dist", "**/.venv", "**/node_modules"]

# Enable useful checks beyond standard mode
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportUnnecessaryTypeIgnoreComment = true

# Suppress noisy rules
reportMissingParameterType = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.0.3",
]
