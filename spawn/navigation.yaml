read-required:
- rules:
  - path: spawn/rules/00-general.md
    description: General language-agnostic conventions (ASCII, documentation, chat language).
  - path: spawn/rules/01-vacancy-cleanup-subtrees.md
    description: finalize_*_repo cleanup must know every adapter-written config subtree; avoid dead configs.
  - path: spawn/rules/02-agent-config-namespacing.md
    description: Local rule file.
  - path: spawn/rules/03-adapter-spawn-warning.md
    description: IDE adapters emit warnings via SpawnWarning category for friendly CLI output.
  - path: spawn/rules/04-adapter-skill-name-constraints.md
    description: Local rule file.
  - path: spawn/rules/05-adapter-canonical-config-file.md
    description: Local rule file.
  - path: spawn/rules/06-new-ide-adapter-checklist.md
    description: Local rule file.
- ext: mempalace-ext
  files:
  - path: .mempalace/wakeup.md
    description: Bounded MemPalace wake-up context from the palace.
  hints:
  - "When finishing a task that involved editing this repo's code or docs: call mempalace_mine (mempalace-mine-mcp), then mempalace_reconnect on mempalace-mcp if already connected."
  - Prefer codebase search via mempalace-mcp first; use workspace full-text / ripgrep only if MemPalace is unavailable or insufficient.
read-contextual:
- ext: ide-adapters
  files:
  - path: spawn/rules/02-agent-config-namespacing.md
    description: Optional convention — spawn-namespaced profiles in agent project configs (project-style adapters).
  - path: spawn/rules/04-adapter-skill-name-constraints.md
    description: Optional convention — adapters sanitize skill names to the agent's stricter regex (name==dirname).
  - path: spawn/rules/05-adapter-canonical-config-file.md
    description: Optional convention — adapters write one canonical config file; no variant-format merges, error before mutation.
  - path: spawn/rules/06-new-ide-adapter-checklist.md
    description: Optional convention — full checklist (wiring, vacancy, tests, docs) for adding a new IDE adapter.
- ext: spectask
  files:
  - path: spec/main.md
    description: Spec-Tasks methodology — folder structure, eight-step process, overview template.
  - path: spec/design/hla.md
    description: Project high-level architecture; updated in Step 8.
  - path: spec/design.yaml
    description: Index of architecture documents under spec/design/ — path and description per entry.
